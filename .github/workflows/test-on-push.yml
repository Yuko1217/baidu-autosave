name: Run AutoSave
on:
  push:
    branches: [ master ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install --upgrade setuptools baidupcs-py
      - name: Run transfer task
        run: python autosave.py
        env:
          BAIDU_COOKIES: ${{ secrets.BAIDU_COOKIES }}
          SHARE_URLS: ${{ secrets.SHARE_URLS }}
          SAVE_DIR: ${{ secrets.SAVE_DIR }}
